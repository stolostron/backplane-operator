---
updates:
- file: "manifests/multicluster-engine.clusterserviceversion.yaml"
  update_list:
  - search: "5.0.1"
    replace: "5.0.1"
external-images:
# The ose-cluster-api and ose-baremetal images are OCP 5.0 payload images,
# pinned to the latest 5.0 stream digests. They are not published to
# registry.redhat.io yet: mirror them from registry.stage.redhat.io via IDMS
# until the OCP 5.0 images are available on prod.
- name: ose-cluster-api
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/ose-cluster-api-rhel9:latest"
  replace: "registry.redhat.io/openshift5/ose-cluster-api-rhel9:v5.0"
- name: ose-baremetal-cluster-api-controllers
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/ose-baremetal-cluster-api-controllers-rhel9:latest"
  replace: "registry.redhat.io/openshift5/ose-baremetal-cluster-api-controllers-rhel9:v5.0"
- name: postgresql-15
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/postgresql-15:latest"
  replace: "registry.redhat.io/rhel9/postgresql-15@sha256:9132b1e3882a6220c8c93cef4e026028a9df8aee2d627e7391fbeced2e9554bc"
- name: postgresql-16
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/postgresql-16:latest"
  replace: "registry.redhat.io/rhel9/postgresql-16@sha256:cf20f6229c5c1cc4cd65be6636b5b06620ba9adb844dfbe080fa7a50605ecd52"
