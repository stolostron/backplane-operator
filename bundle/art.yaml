---
external-images:
# Assisted images are built by ART on mce-2.17; omitting them lets
# doozer substitute ART NVRs instead of 2.11 digest placeholders.
# OCP payload images. MCE 2.17 aligns with OCP 4.22.
- name: ose-cluster-api
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/ose-cluster-api-rhel9:latest"
  replace: "registry.redhat.io/openshift4/ose-cluster-api-rhel9:v4.22"
- name: ose-baremetal-cluster-api-controllers
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/ose-baremetal-cluster-api-controllers-rhel9:latest"
  replace: "registry.redhat.io/openshift4/ose-baremetal-cluster-api-controllers-rhel9:v4.22"
# Third-party images (same pins as backplane-5.0).
- name: postgresql-13
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/postgresql-13:latest"
  replace: "registry.redhat.io/rhel9/postgresql-13@sha256:9b55dfa24e7f9b6911a83fa9379ef377ae256363fc1967d34f096c816a0e9a2c"
- name: postgresql-15
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/postgresql-15:latest"
  replace: "registry.redhat.io/rhel9/postgresql-15@sha256:a760b3213fe32e0514120d6ef49a68ddf2a370928059368a3774520618f648d0"
- name: postgresql-16
  search: "image-registry.openshift-image-registry.svc:5000/multicluster-engine/postgresql-16:latest"
  replace: "registry.redhat.io/rhel9/postgresql-16@sha256:00455f08b15940a326fcb84caacdb0e15543477f0d7b74d54eb46f9147f39be3"
