# Copyright Contributors to the Open Cluster Management project
#
# Standalone Pipelines-as-Code check that runs `make test` (Go unit tests)
# on every PR. It is intentionally NOT a `pipelines.appstudio.openshift.io/
# type: build` pipeline and isn't triggered by/tied to a Snapshot, so it
# does not participate in Konflux's Snapshot/Release gating -- it's a
# plain PR check, running the same `make test` a Prow unit-test job would.
#
# It carries `appstudio.openshift.io/application`/`component` labels
# (pointing at the existing release-mce-51 Application/
# backplane-operator-mce-51 Component for this repo) purely so the
# Konflux UI can resolve it. Without those labels the UI's GithubRedirect
# component (src/components/GithubRedirect/GithubRedirect.tsx in
# konflux-ci/konflux-ui) can never build a redirect URL and gets stuck on
# a permanent "Redirecting to pipeline run..." spinner --
# `shouldRedirect = application && !error` never becomes true if
# `application` is undefined. This mislabels the check's actual branch
# coverage a bit (it also runs on backplane-5.2 and main, not just
# backplane-5.1), but that's a cosmetic tradeoff for being able to view
# it in the UI at all.
#
# This replaces the previous .tekton/backplane-operator-main-unit-test.yaml,
# which was a bare `kind: Pipeline` (not a `PipelineRun`) -- it required
# an IntegrationTestScenario to invoke it, and no such ITS existed in the
# crt-redhat-acm-tenant namespace, so it never actually ran. It also used
# the same runtime `dnf install`/`curl dl.google.com`/`go install
# ...@latest` pattern that proved fragile in stolostron/multiclusterhub-
# operator#3893 (2h hang from an unrelated issue, since fixed there).
#
# See stolostron/multiclusterhub-operator PR #4657 for the design this
# is based on, including:
#   - registry.redhat.io/ubi9/go-toolset, not
#     brew.registry.redhat.io/rh-osbs/openshift-golang-builder (the
#     product build's base image) -- that credential only authenticates
#     within the officially blessed build pipeline, not a generic custom
#     Task, and fails fast with ImagePullBackOff/unauthorized otherwise.
#   - Explicit `computeResources`: without it, Tekton injects a 2Gi
#     memory limit and `go vet ./...` gets OOMKilled. GOFLAGS=-p=2 caps
#     parallel compile workers so peak memory isn't driven up by the
#     node's CPU count.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/stolostron/backplane-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && (target_branch == "main" || target_branch == "backplane-5.1" || target_branch == "backplane-5.2")
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: release-mce-51
    appstudio.openshift.io/component: backplane-operator-mce-51
    pipelines.appstudio.openshift.io/type: test
  name: backplane-operator-unit-tests
  namespace: crt-redhat-acm-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  timeouts:
    pipeline: "20m"
  pipelineSpec:
    params:
      - name: git-url
        type: string
      - name: revision
        type: string
    tasks:
      - name: unit-test
        params:
          - name: git-url
            value: $(params.git-url)
          - name: revision
            value: $(params.revision)
        taskSpec:
          params:
            - name: git-url
              type: string
            - name: revision
              type: string
          steps:
            - name: run-unit-tests
              image: registry.redhat.io/ubi9/go-toolset:1.26
              workingDir: /workspace
              computeResources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 6Gi
              env:
                - name: GIT_URL
                  value: $(params.git-url)
                - name: REVISION
                  value: $(params.revision)
                - name: HOME
                  value: /tmp/home
                - name: GOPATH
                  value: /tmp/go
                - name: GOCACHE
                  value: /tmp/go-cache
                - name: GOFLAGS
                  value: -p=2
              script: |
                #!/bin/bash
                set -uo pipefail
                mkdir -p "${HOME}"

                echo "===== Checking required tools ====="
                # This image runs as a non-root, OpenShift-arbitrary UID, so
                # we can't `microdnf install` anything missing here --
                # go-toolset already ships git/make/go, so just verify.
                for tool in git make go; do
                  if ! command -v "${tool}" >/dev/null 2>&1; then
                    echo "Required tool '${tool}' not found in this image."
                    exit 1
                  fi
                done
                echo "git:  $(git --version)"
                echo "make: $(make --version | head -1)"
                echo "go:   $(go version)"

                echo "===== Cloning ${GIT_URL}@${REVISION} ====="
                git clone --quiet "${GIT_URL}" src
                cd src
                git checkout --quiet "${REVISION}"

                echo "===== Running unit tests: make test ====="
                # Bounded to 10m so a stuck download fails fast instead of
                # hanging for hours (see multiclusterhub-operator#3893).
                if timeout 600 make test; then
                  echo "Unit tests passed."
                else
                  echo "make test failed or timed out after 10m."
                  exit 1
                fi
  taskRunTemplate:
    serviceAccountName: build-pipeline-backplane-operator-mce-51
status: {}
