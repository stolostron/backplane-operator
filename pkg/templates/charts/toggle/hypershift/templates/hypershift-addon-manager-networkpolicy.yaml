{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypershift-addon-manager-network-policy
spec:
  podSelector:
    matchLabels:
      app: hypershift-addon-manager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: 9443
      protocol: TCP
  egress:
  - {}
{{- end }}
