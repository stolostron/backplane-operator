global:
  deployOnOCP: true
  imageOverrides:
    cluster_api_provider_openshift_assisted_bootstrap: ''
    cluster_api_provider_openshift_assisted_control_plane: ''
  namespace: default
  networkPolicies:
    enabled: true
  olmVersion: v0
  pullSecret: null
  templateOverrides: {}
hubconfig:
  nodeSelector: null
  ocpVersion: 4.12.0
  probeConfig: null
  proxyConfigs: null
  replicaCount: 1
  tolerations: []
org: open-cluster-management

legacyManagedEgressRules:
  - ports:
    - port: 5353
      protocol: UDP
    - port: 5353
      protocol: TCP
  - ports:
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
