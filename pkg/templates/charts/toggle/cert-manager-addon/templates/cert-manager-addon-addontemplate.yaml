apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: cert-manager-addon
spec:
  addonName: cert-manager-addon
  agentSpec:
    manifestConfigs:
      # CreateOnly: Job won't be recreated after completion
      - resourceIdentifier:
          group: batch
          resource: jobs
          namespace: cert-manager
          name: cert-manager-crd-install
        updateStrategy:
          type: CreateOnly
      - resourceIdentifier:
          group: apps
          resource: deployments
          namespace: cert-manager
          name: cert-manager-webhook
        updateStrategy:
          type: ServerSideApply
      - resourceIdentifier:
          group: apps
          resource: deployments
          namespace: cert-manager
          name: cert-manager
        updateStrategy:
          type: ServerSideApply
      # Preserve caBundle injected by cainjector
      - resourceIdentifier:
          group: admissionregistration.k8s.io
          resource: validatingwebhookconfigurations
          name: cert-manager-webhook
        updateStrategy:
          type: ServerSideApply
          serverSideApply:
            force: true
            ignoreFields:
              - condition: OnSpokePresent
                jsonPaths:
                  - .webhooks[*].clientConfig.caBundle
      - resourceIdentifier:
          group: admissionregistration.k8s.io
          resource: mutatingwebhookconfigurations
          name: cert-manager-webhook
        updateStrategy:
          type: ServerSideApply
          serverSideApply:
            force: true
            ignoreFields:
              - condition: OnSpokePresent
                jsonPaths:
                  - .webhooks[*].clientConfig.caBundle
    workload:
      manifests:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: cert-manager
            annotations:
              addon.open-cluster-management.io/deletion-orphan: ""
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

        # CRD Installation Job
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cert-manager-crd-install
            namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-crd-install
          rules:
            - apiGroups: ["apiextensions.k8s.io"]
              resources: ["customresourcedefinitions"]
              verbs: ["create", "get", "list", "watch", "update", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-crd-install
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-crd-install
          subjects:
            - kind: ServiceAccount
              name: cert-manager-crd-install
              namespace: cert-manager

        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: cert-manager-crd-install
            namespace: cert-manager
          spec:
            manualSelector: true
            selector:
              matchLabels:
                job-name: cert-manager-crd-install
            template:
              metadata:
                labels:
                  job-name: cert-manager-crd-install
              spec:
                serviceAccountName: cert-manager-crd-install
                restartPolicy: OnFailure
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: crd-install
                    image: '{{ .Values.global.imageOverrides.cert_manager_kubectl }}'
                    args:
                      - apply
                      - -f
                      - '{{ `{{certManagerCrdsUrl}}` }}'
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                volumes:
                  - name: tmp
                    emptyDir: {}

        # ServiceAccounts
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cert-manager-cainjector
            namespace: cert-manager

        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cert-manager
            namespace: cert-manager

        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cert-manager-webhook
            namespace: cert-manager

        # ClusterRoles
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-cainjector
          rules:
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["get", "create", "update", "patch"]
            - apiGroups: ["admissionregistration.k8s.io"]
              resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
              verbs: ["get", "list", "watch", "update", "patch"]
            - apiGroups: ["apiregistration.k8s.io"]
              resources: ["apiservices"]
              verbs: ["get", "list", "watch", "update", "patch"]
            - apiGroups: ["apiextensions.k8s.io"]
              resources: ["customresourcedefinitions"]
              verbs: ["get", "list", "watch", "update", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-issuers
          rules:
            - apiGroups: ["cert-manager.io"]
              resources: ["issuers", "issuers/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["cert-manager.io"]
              resources: ["issuers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch", "create", "update", "delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-clusterissuers
          rules:
            - apiGroups: ["cert-manager.io"]
              resources: ["clusterissuers", "clusterissuers/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["cert-manager.io"]
              resources: ["clusterissuers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch", "create", "update", "delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-certificates
          rules:
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates", "certificates/status", "certificaterequests", "certificaterequests/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates", "certificaterequests", "clusterissuers", "issuers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates/finalizers", "certificaterequests/finalizers"]
              verbs: ["update"]
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["orders"]
              verbs: ["create", "delete", "get", "list", "watch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-orders
          rules:
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["orders", "orders/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["orders", "challenges"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["cert-manager.io"]
              resources: ["clusterissuers", "issuers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["challenges"]
              verbs: ["create", "delete"]
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["orders/finalizers"]
              verbs: ["update"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-challenges
          rules:
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["challenges", "challenges/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["challenges"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["cert-manager.io"]
              resources: ["issuers", "clusterissuers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
            - apiGroups: [""]
              resources: ["pods", "services"]
              verbs: ["get", "list", "watch", "create", "delete"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses"]
              verbs: ["get", "list", "watch", "create", "delete", "update"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes"]
              verbs: ["get", "list", "watch", "create", "delete", "update"]
            - apiGroups: ["acme.cert-manager.io"]
              resources: ["challenges/finalizers"]
              verbs: ["update"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-ingress-shim
          rules:
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates", "certificaterequests"]
              verbs: ["create", "update", "delete"]
            - apiGroups: ["cert-manager.io"]
              resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses/finalizers"]
              verbs: ["update"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["gateways", "httproutes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["gateways/finalizers", "httproutes/finalizers"]
              verbs: ["update"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-approve:cert-manager-io
          rules:
            - apiGroups: ["cert-manager.io"]
              resources: ["signers"]
              verbs: ["approve"]
              resourceNames:
                - "issuers.cert-manager.io/*"
                - "clusterissuers.cert-manager.io/*"

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-controller-certificatesigningrequests
          rules:
            - apiGroups: ["certificates.k8s.io"]
              resources: ["certificatesigningrequests"]
              verbs: ["get", "list", "watch", "update"]
            - apiGroups: ["certificates.k8s.io"]
              resources: ["certificatesigningrequests/status"]
              verbs: ["update", "patch"]
            - apiGroups: ["certificates.k8s.io"]
              resources: ["signers"]
              resourceNames: ["issuers.cert-manager.io/*", "clusterissuers.cert-manager.io/*"]
              verbs: ["sign"]
            - apiGroups: ["authorization.k8s.io"]
              resources: ["subjectaccessreviews"]
              verbs: ["create"]

        # ClusterRoleBindings
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-cainjector
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-cainjector
          subjects:
            - kind: ServiceAccount
              name: cert-manager-cainjector
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-issuers
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-issuers
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-clusterissuers
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-clusterissuers
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-certificates
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-certificates
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-orders
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-orders
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-challenges
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-challenges
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-ingress-shim
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-ingress-shim
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-approve:cert-manager-io
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-approve:cert-manager-io
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-controller-certificatesigningrequests
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-controller-certificatesigningrequests
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        # Leader election Roles
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: cert-manager-cainjector:leaderelection
            namespace: kube-system
          rules:
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              resourceNames: ["cert-manager-cainjector-leader-election"]
              verbs: ["get", "update", "patch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["create"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: cert-manager:leaderelection
            namespace: kube-system
          rules:
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              resourceNames: ["cert-manager-controller"]
              verbs: ["get", "update", "patch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["create"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: cert-manager-cainjector:leaderelection
            namespace: kube-system
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: cert-manager-cainjector:leaderelection
          subjects:
            - kind: ServiceAccount
              name: cert-manager-cainjector
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: cert-manager:leaderelection
            namespace: kube-system
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: cert-manager:leaderelection
          subjects:
            - kind: ServiceAccount
              name: cert-manager
              namespace: cert-manager

        # Webhook RBAC
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: cert-manager-webhook:subjectaccessreviews
          rules:
            - apiGroups: ["authorization.k8s.io"]
              resources: ["subjectaccessreviews"]
              verbs: ["create"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: cert-manager-webhook:subjectaccessreviews
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cert-manager-webhook:subjectaccessreviews
          subjects:
            - kind: ServiceAccount
              name: cert-manager-webhook
              namespace: cert-manager

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: cert-manager-webhook:dynamic-serving
            namespace: cert-manager
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["cert-manager-webhook-ca"]
              verbs: ["get", "list", "watch", "update"]
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: cert-manager-webhook:dynamic-serving
            namespace: cert-manager
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: cert-manager-webhook:dynamic-serving
          subjects:
            - kind: ServiceAccount
              name: cert-manager-webhook
              namespace: cert-manager

        # Services
        - apiVersion: v1
          kind: Service
          metadata:
            name: cert-manager
            namespace: cert-manager
          spec:
            ports:
              - port: 9402
                protocol: TCP
                targetPort: 9402
            selector:
              app.kubernetes.io/name: cert-manager
              app.kubernetes.io/component: controller

        - apiVersion: v1
          kind: Service
          metadata:
            name: cert-manager-webhook
            namespace: cert-manager
          spec:
            ports:
              - name: https
                port: 443
                protocol: TCP
                targetPort: 10250
            selector:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/component: webhook

        # Deployments
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cert-manager-cainjector
            namespace: cert-manager
            labels:
              app.kubernetes.io/name: cainjector
              app.kubernetes.io/component: cainjector
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: cainjector
                app.kubernetes.io/component: cainjector
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: cainjector
                  app.kubernetes.io/component: cainjector
              spec:
                serviceAccountName: cert-manager-cainjector
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: cert-manager-cainjector
                    image: '{{ .Values.global.imageOverrides.cert_manager_cainjector }}'
                    imagePullPolicy: '{{ .Values.global.pullPolicy }}'
                    args:
                      - --v=2
                      - --leader-election-namespace=kube-system
                    env:
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true

        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cert-manager
            namespace: cert-manager
            labels:
              app.kubernetes.io/name: cert-manager
              app.kubernetes.io/component: controller
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: cert-manager
                app.kubernetes.io/component: controller
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/component: controller
              spec:
                serviceAccountName: cert-manager
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: cert-manager-controller
                    image: '{{ .Values.global.imageOverrides.cert_manager_controller }}'
                    imagePullPolicy: '{{ .Values.global.pullPolicy }}'
                    args:
                      - --v=2
                      - --cluster-resource-namespace=$(POD_NAMESPACE)
                      - --leader-election-namespace=kube-system
                    env:
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    ports:
                      - containerPort: 9402
                        name: http-metrics
                        protocol: TCP
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true

        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cert-manager-webhook
            namespace: cert-manager
            labels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/component: webhook
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: webhook
                app.kubernetes.io/component: webhook
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: webhook
                  app.kubernetes.io/component: webhook
              spec:
                serviceAccountName: cert-manager-webhook
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: cert-manager-webhook
                    image: '{{ .Values.global.imageOverrides.cert_manager_webhook }}'
                    imagePullPolicy: '{{ .Values.global.pullPolicy }}'
                    args:
                      - --v=2
                      - --secure-port=10250
                      - --dynamic-serving-ca-secret-namespace=$(POD_NAMESPACE)
                      - --dynamic-serving-ca-secret-name=cert-manager-webhook-ca
                      - --dynamic-serving-dns-names=cert-manager-webhook
                      - --dynamic-serving-dns-names=cert-manager-webhook.cert-manager
                      - --dynamic-serving-dns-names=cert-manager-webhook.cert-manager.svc
                    ports:
                      - name: https
                        protocol: TCP
                        containerPort: 10250
                      - name: healthcheck
                        protocol: TCP
                        containerPort: 6080
                    livenessProbe:
                      httpGet:
                        path: /livez
                        port: 6080
                        scheme: HTTP
                      initialDelaySeconds: 60
                      periodSeconds: 10
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 6080
                        scheme: HTTP
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    env:
                      - name: POD_NAMESPACE
                        valueFrom:
                          fieldRef:
                            fieldPath: metadata.namespace
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true

        # Webhook Configurations
        - apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingWebhookConfiguration
          metadata:
            name: cert-manager-webhook
            annotations:
              cert-manager.io/inject-ca-from-secret: cert-manager/cert-manager-webhook-ca
            labels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/component: webhook
          webhooks:
            - name: webhook.cert-manager.io
              rules:
                - apiGroups: ["cert-manager.io", "acme.cert-manager.io"]
                  apiVersions: ["v1"]
                  operations: ["CREATE", "UPDATE"]
                  resources: ["*/*"]
              admissionReviewVersions: ["v1"]
              matchPolicy: Equivalent
              timeoutSeconds: 10
              failurePolicy: Fail
              sideEffects: None
              clientConfig:
                service:
                  name: cert-manager-webhook
                  namespace: cert-manager
                  path: /validate

        - apiVersion: admissionregistration.k8s.io/v1
          kind: MutatingWebhookConfiguration
          metadata:
            name: cert-manager-webhook
            annotations:
              cert-manager.io/inject-ca-from-secret: cert-manager/cert-manager-webhook-ca
            labels:
              app.kubernetes.io/name: webhook
              app.kubernetes.io/component: webhook
          webhooks:
            - name: webhook.cert-manager.io
              rules:
                - apiGroups: ["cert-manager.io"]
                  apiVersions: ["v1"]
                  operations: ["CREATE"]
                  resources: ["certificaterequests"]
              admissionReviewVersions: ["v1"]
              matchPolicy: Equivalent
              timeoutSeconds: 10
              failurePolicy: Fail
              sideEffects: None
              clientConfig:
                service:
                  name: cert-manager-webhook
                  namespace: cert-manager
                  path: /mutate

        # Pre-delete confirmation guard
        # Delete MCA without ConfigMap cert-manager-addon-confirm-delete (confirm=yes) → Job fails → deletion blocked
        # Create confirm ConfigMap → Job succeeds → MCA deletes; orphaned resources remain
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: cert-manager-addon-predelete
            namespace: cert-manager
            annotations:
              addon.open-cluster-management.io/addon-pre-delete: ""

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: cert-manager-addon-predelete
            namespace: cert-manager
            annotations:
              addon.open-cluster-management.io/addon-pre-delete: ""
          rules:
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "list"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: cert-manager-addon-predelete
            namespace: cert-manager
            annotations:
              addon.open-cluster-management.io/addon-pre-delete: ""
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: cert-manager-addon-predelete
          subjects:
            - kind: ServiceAccount
              name: cert-manager-addon-predelete
              namespace: cert-manager

        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: cert-manager-addon-predelete
            namespace: cert-manager
            annotations:
              addon.open-cluster-management.io/addon-pre-delete: ""
          spec:
            activeDeadlineSeconds: 300
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            manualSelector: true
            selector:
              matchLabels:
                job-name: cert-manager-addon-predelete
            template:
              metadata:
                labels:
                  job-name: cert-manager-addon-predelete
              spec:
                restartPolicy: Never
                serviceAccountName: cert-manager-addon-predelete
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: confirm-delete
                    image: '{{ .Values.global.imageOverrides.cert_manager_kubectl }}'
                    command:
                      - /bin/bash
                      - -c
                      - |
                        echo "cert-manager-addon PRE-DELETE CONFIRMATION CHECK"
                        if kubectl get configmap cert-manager-addon-confirm-delete -n cert-manager -o jsonpath='{.data.confirm}' 2>/dev/null | grep -q "^yes$"; then
                          echo "Confirmation found. Proceeding with addon removal."
                          echo "NOTE: cert-manager resources are orphaned and will continue running."
                          exit 0
                        fi
                        echo "Confirmation NOT found."
                        echo "To confirm removal, create: kubectl create configmap cert-manager-addon-confirm-delete --from-literal=confirm=yes -n cert-manager"
                        exit 1
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
