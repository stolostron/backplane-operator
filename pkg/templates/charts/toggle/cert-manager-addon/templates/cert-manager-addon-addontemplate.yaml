apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: cert-manager-addon
spec:
  addonName: cert-manager-addon
  agentSpec:
    manifestConfigs:
      # Track the Subscription with CreateOnly — OLM owns spec/status after creation (e.g. it may
      # rewrite fields during upgrades); do not let ManifestWork's default Update strategy fight
      # with OLM on every reconcile. Mirrors the CreateOnly pattern used for the upstream
      # community addon's CRD-install Job.
      - resourceIdentifier:
          group: operators.coreos.com
          resource: subscriptions
          namespace: cert-manager-operator
          name: openshift-cert-manager-operator
        updateStrategy:
          type: CreateOnly
    workload:
      manifests:
        # ============================================================
        # cert-manager Operator for Red Hat OpenShift — installed via OLM from the
        # redhat-operators catalog. This uses Red Hat-built images end-to-end: OLM resolves
        # the operator image from the CSV in the catalog (registry.redhat.io), and the operator
        # in turn deploys the cert-manager controller/webhook/cainjector operand images and
        # installs the cert-manager CRDs as part of its own ClusterServiceVersion — no
        # community quay.io/jetstack images and no separate CRD-install Job are needed.
        #
        # Namespace is orphaned on addon delete so leftover Certificate CRs/secrets created by
        # the operand elsewhere in the cluster are not implicated by removing this namespace.
        # ============================================================
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: cert-manager-operator
            annotations:
              addon.open-cluster-management.io/deletion-orphan: ""
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

        - apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            targetNamespaces:
              - cert-manager-operator
            upgradeStrategy: Default

        - apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            channel: '{{ `{{channel}}` }}'
            name: openshift-cert-manager-operator
            source: '{{ `{{catalogSource}}` }}'
            sourceNamespace: '{{ `{{catalogSourceNamespace}}` }}'
            installPlanApproval: '{{ `{{installPlanApproval}}` }}'
            config:
              nodeSelector: {}
              tolerations: []

        # ============================================================
        # RBAC for the work agent on the managed cluster.
        # klusterlet-work-sa applies every manifest in this ManifestWork; grant it explicit
        # permission to manage the OLM resources above (namespace/OperatorGroup/Subscription)
        # so the addon install does not fail with "forbidden" on clusters where the work agent's
        # default permissions do not already cover operators.coreos.com resources.
        # ============================================================
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: open-cluster-management:cert-manager-addon
          rules:
            - apiGroups: ["operators.coreos.com"]
              resources: ["operatorgroups", "subscriptions"]
              verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["create", "get", "list", "watch", "update", "patch"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: open-cluster-management:cert-manager-addon
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: open-cluster-management:cert-manager-addon
          subjects:
            - kind: ServiceAccount
              name: klusterlet-work-sa
              namespace: open-cluster-management-agent
