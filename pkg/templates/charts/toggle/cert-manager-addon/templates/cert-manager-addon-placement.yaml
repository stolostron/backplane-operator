apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: cert-manager-addon
  namespace: open-cluster-management-global-set
spec:
  clusterSets:
  - global
  predicates:
  # OLM's redhat-operators CatalogSource, and therefore the cert-manager Operator for Red Hat
  # OpenShift package, is only available on OpenShift managed clusters — restrict rollout so
  # non-OpenShift managed clusters (if any are grouped in the "global" ManagedClusterSet) never
  # get a ManagedClusterAddOn they cannot satisfy.
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - key: vendor
          operator: In
          values:
          - OpenShift
        - key: cert-manager-addon
          operator: NotIn
          values:
          - disabled
