{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-operator-allow-api-server
  namespace: '{{ .Values.global.namespace }}'
spec:
  podSelector:
    matchLabels:
      app: discovery-operator
  egress:
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  policyTypes:
  - Egress
{{- end }}
