{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-operator-allow-metrics
  namespace: '{{ .Values.global.namespace }}'
spec:
  ingress:
  - ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: discovery-operator
  policyTypes:
  - Ingress
{{- end }}
