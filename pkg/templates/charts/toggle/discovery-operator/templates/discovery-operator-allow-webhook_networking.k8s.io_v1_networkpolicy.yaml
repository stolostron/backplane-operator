{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-operator-allow-webhook
  namespace: '{{ .Values.global.namespace }}'
spec:
  podSelector:
    matchLabels:
      app: discovery-operator
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ''
    ports:
    - protocol: TCP
      port: 9443
  policyTypes:
  - Ingress
{{- end }}
