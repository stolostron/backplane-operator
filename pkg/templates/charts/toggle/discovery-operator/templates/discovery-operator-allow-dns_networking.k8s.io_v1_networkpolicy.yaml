{{- if .Values.global.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-operator-allow-dns
  namespace: '{{ .Values.global.namespace }}'
spec:
  egress:
  - ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
    - port: 5353
      protocol: TCP
    - port: 5353
      protocol: UDP
  podSelector:
    matchLabels:
      app: discovery-operator
  policyTypes:
  - Egress
{{- end }}
