apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    cluster.x-k8s.io/provider: kubevirt
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: capk-edit-aggregate
rules:
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - kubevirtclustertemplates
  - kubevirtmachinetemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - kubevirtclusters
  verbs:
  - get
  - list
  - watch
