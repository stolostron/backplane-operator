apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capk-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capk-controller-manager
subjects:
  - kind: ServiceAccount
    name: capk-controller-manager
    namespace: '{{ .Values.global.namespace }}'
