apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    cluster.x-k8s.io/provider: kubevirt
    cluster.x-k8s.io/v1beta1: v1alpha1
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: mce-capk-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mce-capk-manager-role
subjects:
- kind: ServiceAccount
  name: mce-capk-manager
  namespace: '{{ default "multicluster-engine" .Values.global.namespace }}'
