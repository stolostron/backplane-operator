apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: mce-capk-webhook-service-cert
  labels:
    cluster.x-k8s.io/provider: kubevirt
    cluster.x-k8s.io/v1beta1: v1alpha1
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: mce-capk-webhook-service
  namespace: '{{ default "multicluster-engine" .Values.global.namespace }}'
spec:
  ports:
  - port: 443
    targetPort: 9443
  selector:
    cluster.x-k8s.io/provider: kubevirt
    cluster.x-k8s.io/v1beta1: v1alpha1
    cluster.x-k8s.io/v1beta2: v1alpha1
    control-plane: controller-manager
