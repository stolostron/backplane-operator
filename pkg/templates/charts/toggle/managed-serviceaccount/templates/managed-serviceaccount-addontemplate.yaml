apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: managed-serviceaccount
spec:
  addonName: managed-serviceaccount
  agentSpec:
    workload:
      manifests:
      - apiVersion: v1
        kind: Namespace
        metadata:
          annotations:
            addon.open-cluster-management.io/deletion-orphan: ''
          labels:
            addon.open-cluster-management.io/namespace: 'true'
          name: open-cluster-management-agent-addon
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: open-cluster-management:managed-serviceaccount:addon-agent
        rules:
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: open-cluster-management:managed-serviceaccount:addon-agent{{ `{{INSTALL_NAMESPACE}}` }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: open-cluster-management:managed-serviceaccount:addon-agent
        subjects:
        - kind: ServiceAccount
          name: managed-serviceaccount
          namespace: open-cluster-management-agent-addon
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: managed-serviceaccount-addon-agent
          namespace: open-cluster-management-agent-addon
        spec:
          replicas: 1
          selector:
            matchLabels:
              addon-agent: managed-serviceaccount
          template:
            metadata:
              annotations:
                target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
              labels:
                addon-agent: managed-serviceaccount
            spec:
              containers:
              - args:
                - --cluster-name={{ `{{CLUSTER_NAME}}` }}
                - --kubeconfig={{ `{{HUB_KUBECONFIG}}` }}
                - --feature-gates=EphemeralIdentity=true
                command:
                - /msa
                - agent
                image: '{{ .Values.global.imageOverrides.managed_serviceaccount }}'
                imagePullPolicy: IfNotPresent
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8000
                  initialDelaySeconds: 2
                  periodSeconds: 10
                name: addon-agent
                ports:
                - containerPort: 38080
                  name: metrics
                  protocol: TCP
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccount: managed-serviceaccount
      - apiVersion: v1
        kind: Service
        metadata:
          labels:
            addon-agent: managed-serviceaccount
          name: managed-serviceaccount-addon-agent
          namespace: open-cluster-management-agent-addon
        spec:
          ports:
          - name: metrics
            port: 38080
            protocol: TCP
            targetPort: metrics
          selector:
            addon-agent: managed-serviceaccount
{{- if .Values.global.networkPolicies.enabled }}
      # ACM override: upstream uses .Values.networkPolicies.enabled; backplane uses
      # .Values.global.networkPolicies.enabled (from MCE spec.networkPolicies.enabled).
      # Purpose: Default-deny for managed-serviceaccount-addon-agent on the managed
      # cluster, then allow DNS + hub/spoke API egress. Health ingress (:8000) allows
      # kubelet livenessProbe /healthz. Metrics ingress (:38080) is opened because the
      # AddOnTemplate always exposes the metrics Service (no separate prometheus toggle
      # in this chart). Peers are port-based for portability across Kubernetes vendors.
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: managed-serviceaccount-addon-agent-network-policy
          namespace: open-cluster-management-agent-addon
          labels:
            addon-agent: managed-serviceaccount
        spec:
          podSelector:
            matchLabels:
              addon-agent: managed-serviceaccount
          policyTypes:
          - Ingress
          - Egress
          ingress:
          # kubelet livenessProbe /healthz
          - ports:
            - protocol: TCP
              port: 8000
          # metrics Service (:38080)
          - ports:
            - protocol: TCP
              port: 38080
          egress:
          # DNS (:53 common; :5353 used by some distributions)
          - ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
            - protocol: UDP
              port: 5353
            - protocol: TCP
              port: 5353
          # Hub kubeconfig API and spoke kube-apiserver
          - ports:
            - protocol: TCP
              port: 443
            - protocol: TCP
              port: 6443
{{- end }}
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: open-cluster-management:managed-serviceaccount:addon-agent
          namespace: open-cluster-management-agent-addon
        rules:
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
        - apiGroups:
          - ''
          resources:
          - serviceaccounts
          - serviceaccounts/token
          verbs:
          - get
          - watch
          - list
          - create
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - create
          - update
          - patch
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenrequests
          verbs:
          - get
          - create
          - update
          - patch
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: open-cluster-management:managed-serviceaccount:addon-agent
          namespace: open-cluster-management-agent-addon
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: open-cluster-management:managed-serviceaccount:addon-agent
        subjects:
        - kind: ServiceAccount
          name: managed-serviceaccount
          namespace: open-cluster-management-agent-addon
      - apiVersion: v1
        imagePullSecrets:
        - name: open-cluster-management-image-pull-credentials
        kind: ServiceAccount
        metadata:
          name: managed-serviceaccount
          namespace: open-cluster-management-agent-addon
  registration:
  - kubeClient:
      hubPermissions:
      - currentCluster:
          clusterRoleName: managed-serviceaccount-addon-agent
        type: CurrentCluster
    type: KubeClient
