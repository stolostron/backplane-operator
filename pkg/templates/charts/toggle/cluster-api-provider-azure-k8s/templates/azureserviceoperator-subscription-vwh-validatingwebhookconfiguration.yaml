apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: capz-system/azureserviceoperator-serving-cert
  name: azureserviceoperator-subscription-vwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Values.global.namespace }}'
      path: /validate-subscription-azure-com-v1api20211001-alias
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20211001.aliases.subscription.azure.com
  rules:
  - apiGroups:
    - subscription.azure.com
    apiVersions:
    - v1api20211001
    operations:
    - CREATE
    - UPDATE
    resources:
    - aliases
  sideEffects: None
