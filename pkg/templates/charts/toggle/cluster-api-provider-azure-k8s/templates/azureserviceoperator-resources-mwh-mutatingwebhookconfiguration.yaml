apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: capz-system/azureserviceoperator-serving-cert
  name: azureserviceoperator-resources-mwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Values.global.namespace }}'
      path: /mutate-resources-azure-com-v1api20200601-resourcegroup
  failurePolicy: Fail
  matchPolicy: Exact
  name: default.v1api20200601.resourcegroups.resources.azure.com
  rules:
  - apiGroups:
    - resources.azure.com
    apiVersions:
    - v1api20200601
    operations:
    - CREATE
    - UPDATE
    resources:
    - resourcegroups
  sideEffects: None
