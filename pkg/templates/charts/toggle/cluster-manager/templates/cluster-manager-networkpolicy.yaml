{{- if .Values.global.networkPolicies.enabled }}
# Purpose: Default-deny for the registration-operator (cluster-manager Deployment
# in the MCE target namespace), then allow DNS and Kubernetes API egress.
# No ingress rules — health probes (:8443) are not blocked by NetworkPolicy.
# Gaps: API egress limited to :443/:6443; DNS is port-only.
#
# Hub controllers (registration/work/placement/addon-manager) are covered by
# OCM-embedded NPs when ClusterManager FeatureGate NetworkPolicies is enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-manager-network-policy
spec:
  podSelector:
    matchLabels:
      app: cluster-manager
  policyTypes:
  - Ingress
  - Egress
  egress:
  # DNS (:53 common; :5353 used by some distributions)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Kubernetes API
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
{{- end }}
